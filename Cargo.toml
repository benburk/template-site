[package]
name = "project-name"
version = "0.1.0"
edition = "2024"

# The library keeps a fixed crate name so the binary, the tests, and the
# tracing filter never have to spell out the project's name.
[lib]
name = "app"

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
axum = "0.8.4"
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
dotenvy = "0.15.7"
maud = { version = "0.27.0", features = ["axum"] }
serde = { version = "1.0.219", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid"] }
time = "0.3.41"
tokio = { version = "1.47.1", features = ["full"] }
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter"] }
uuid = { version = "1.17.0", features = ["v4"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Noisy pedantic lints not worth enforcing in an application.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[dev-dependencies]
tokio-test = "0.4"
